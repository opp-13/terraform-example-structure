name: Terraform PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "env/**"

permissions:
  contents: read

jobs:
  # Gate #1 - native GitHub Environment "required reviewers". Runs before we even know
  # which env/<name> dirs changed, per the required flow order (test approval -> lint).
  test-approval:
    runs-on: [self-hosted, codebuild-ephemeral]
    environment: test-approval
    steps:
      - run: echo "Test approval passed"

  detect-envs:
    needs: test-approval
    runs-on: [self-hosted, codebuild-ephemeral]
    outputs:
      envs: ${{ steps.diff.outputs.envs }}
      any: ${{ steps.diff.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - id: diff
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          ENVS=$(git diff --name-only "$BASE" "$HEAD" -- env | awk -F/ '{print $2}' | sort -u)
          JSON=$(printf '%s\n' "$ENVS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "envs=$JSON" >> "$GITHUB_OUTPUT"
          if [ "$JSON" != "[]" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: detect-envs
    if: needs.detect-envs.outputs.any == 'true'
    strategy:
      matrix:
        env: ${{ fromJSON(needs.detect-envs.outputs.envs) }}
    runs-on: [self-hosted, codebuild-ephemeral]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - run: terraform -chdir=env/${{ matrix.env }} fmt -check -recursive
      - run: terraform -chdir=env/${{ matrix.env }} init -backend=false
      - run: terraform -chdir=env/${{ matrix.env }} validate

  # Gate #2 target is per-<env>-plan environment, so the OIDC sub claim
  # (repo:ORG/REPO:environment:<env>-plan) only lets a PR-plan job assume the read-only
  # role - never the apply role.
  plan:
    needs: [lint, detect-envs]
    strategy:
      matrix:
        env: ${{ fromJSON(needs.detect-envs.outputs.envs) }}
    runs-on: [self-hosted, codebuild-ephemeral]
    environment: ${{ matrix.env }}-plan
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    concurrency:
      group: tf-plan-${{ matrix.env }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Backend (S3 state) access rides on this shared runner's own ambient CodeBuild
      # role - it lives in the same central account as the bucket, so no OIDC assume-role
      # is needed just to init/read/write state. See init/runner/README.md.
      - run: terraform -chdir=env/${{ matrix.env }} init

      # Only the "aws" provider (actual resource reads/writes in the target account) goes
      # through the per-environment OIDC role, via Terraform's own
      # assume_role_with_web_identity - not aws-actions/configure-aws-credentials, since
      # that would set ambient credentials for the whole job (including the backend init
      # above) rather than scoping OIDC just to the provider.
      - name: Get GitHub OIDC token for AWS
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const token = await core.getIDToken('sts.amazonaws.com');
            const tokenFile = `${process.env.RUNNER_TEMP}/gh_oidc_token`;
            fs.writeFileSync(tokenFile, token);
            core.setOutput('token_file', tokenFile);

      - id: plan
        run: |
          set +e
          terraform -chdir=env/${{ matrix.env }} plan -no-color -input=false -out=tfplan -detailed-exitcode \
            -var="oidc_role_arn=arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/gha-${{ matrix.env }}-plan" \
            -var="web_identity_token_file=${{ steps.oidc.outputs.token_file }}"
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Render plan output
        if: steps.plan.outputs.exitcode != '1'
        run: terraform -chdir=env/${{ matrix.env }} show -no-color tfplan > env/${{ matrix.env }}/plan.txt

      - name: Upload plan artifact
        if: steps.plan.outputs.exitcode != '1'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}-${{ github.event.pull_request.number }}
          path: env/${{ matrix.env }}/tfplan
          retention-days: 5

      - name: Comment plan on PR
        if: steps.plan.outputs.exitcode != '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = "${{ matrix.env }}";
            const exitcode = "${{ steps.plan.outputs.exitcode }}";
            const status = exitcode === "0" ? "변경 없음" : "변경 있음";
            const raw = fs.readFileSync(`env/${env}/plan.txt`, 'utf8');
            const MAX = 60000;
            const body = raw.length > MAX
              ? raw.slice(0, MAX) + "\n... (truncated - see workflow run for full output)"
              : raw;
            const marker = `<!-- tf-plan:${env} -->`;
            const commentBody = [
              marker,
              `### Terraform Plan — \`${env}\` (${status})`,
              "<details><summary>Show plan</summary>",
              "",
              "```diff",
              body,
              "```",
              "</details>",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: commentBody,
              });
            }

      - name: Fail if plan errored
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

  final-approval:
    needs: [plan, detect-envs]
    strategy:
      matrix:
        env: ${{ fromJSON(needs.detect-envs.outputs.envs) }}
    runs-on: [self-hosted, codebuild-ephemeral]
    environment: ${{ matrix.env }}-apply-approval
    steps:
      - run: echo "Final approval passed for ${{ matrix.env }}"

  # needs: [final-approval] alone blocks until EVERY matrix shard of final-approval has
  # been approved - i.e. every affected environment's reviewers, not just one.
  automerge:
    needs: final-approval
    runs-on: [self-hosted, codebuild-ephemeral]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const expectedSha = context.payload.pull_request.head.sha;

            // Guard against a race where new commits landed on the PR after this run
            // started (e.g. someone force-pushed mid-approval) - merging the wrong SHA
            // would ship code nobody actually approved.
            const { data: fresh } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (fresh.head.sha !== expectedSha) {
              core.setFailed(`PR head changed since this run started (${expectedSha} -> ${fresh.head.sha}); aborting merge - a new run must approve the new commits.`);
              return;
            }

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              merge_method: "squash",
              sha: fresh.head.sha,
            });
